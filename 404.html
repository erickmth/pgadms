<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="A página que você tentou acessar não existe ou foi movida. Volte ao início ou pesquise por um registro na escala.">
<title>404 — Registro não encontrado | AdminEscala</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     TOKENS
  ============================================================ */
  :root{
    --bg:            #08090d;
    --surface-1:     #0e1016;
    --surface-2:     #151822;
    --surface-3:     #1c202c;
    --border:        rgba(255,255,255,.07);
    --border-strong: rgba(255,255,255,.14);
    --text:          #f1f2f6;
    --text-muted:    #8b90a3;
    --text-faint:    #4b4f5e;
    --primary:       #e6393f;
    --primary-dark:  #b82c31;
    --primary-light: #ff6b63;
    --primary-glow:  rgba(230,57,63,.24);
    --radius-lg:     18px;
    --radius-md:     12px;
    --radius-sm:     8px;
    --ease:          cubic-bezier(.22,1,.36,1);
    --font-display:  'Space Grotesk', sans-serif;
    --font-body:     'Inter', sans-serif;
    --font-mono:     'JetBrains Mono', monospace;
  }

  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  html, body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overflow:hidden;
  }

  a{color:inherit;}
  button{font-family:inherit;}

  .skip-link{
    position:absolute; left:-999px; top:0;
    background:var(--primary); color:#fff;
    padding:10px 16px; border-radius:0 0 8px 0;
    font-size:13px; font-weight:600; z-index:200;
  }
  .skip-link:focus{left:0;}

  :focus-visible{
    outline:2px solid var(--primary-light);
    outline-offset:3px;
    border-radius:4px;
  }

  /* ============================================================
     AMBIENT BACKGROUND
  ============================================================ */
  .field{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(760px 480px at 50% -8%, rgba(230,57,63,.10), transparent 60%),
      radial-gradient(900px 620px at 100% 100%, rgba(255,255,255,.025), transparent 55%);
  }
  .grid-lines{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
    background-size:56px 56px;
    mask-image:radial-gradient(ellipse 70% 60% at 50% 40%, #000 20%, transparent 78%);
  }
  .accent-line{
    position:fixed; top:0; left:0; right:0; height:2px; z-index:20;
    background:linear-gradient(90deg, transparent, var(--primary) 45%, var(--primary-light) 55%, transparent);
    opacity:0; animation:reveal .8s var(--ease) .1s forwards;
  }
  @keyframes reveal{ from{opacity:0; transform:scaleX(0);} to{opacity:1; transform:scaleX(1);} }

  /* ============================================================
     LAYOUT
  ============================================================ */
  .wrapper{
    position:relative; z-index:2;
    height:100vh;
    display:grid;
    grid-template-rows:auto 1fr auto;
    padding:22px 32px 18px;
    overflow:hidden;
  }

  header{
    display:flex; align-items:center; justify-content:space-between;
    opacity:0; animation:fadeDown .6s var(--ease) .1s forwards;
  }
  .brand{
    display:flex; align-items:center;
    text-decoration:none;
    margin-right:auto;
  }
  .logo-svg{
    display:block;
    max-height:56px;
    width:auto;
  }

  .status-chip{
    display:flex; align-items:center; gap:8px;
    background:var(--surface-2); border:1px solid var(--border-strong);
    border-radius:100px; padding:6px 14px 6px 10px;
    font-family:var(--font-mono); font-size:11.5px; font-weight:500;
    color:var(--text-muted); letter-spacing:.3px;
  }
  .status-dot{
    width:6px; height:6px; border-radius:50%; background:var(--primary);
    box-shadow:0 0 0 3px var(--primary-glow);
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.45;} }

  main{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    min-height:0;
    overflow:hidden;
  }

  /* ============================================================
     SIGNATURE ILLUSTRATION — mascote triste
  ============================================================ */
  .illustration{
    position:relative;
    display:flex; align-items:center; justify-content:center;
    margin-bottom:18px;
    opacity:0;
    animation:riseIn .8s var(--ease) .3s forwards;
  }
  @keyframes riseIn{ from{opacity:0; transform:translateY(20px) scale(.92);} to{opacity:1; transform:translateY(0) scale(1);} }

  .illustration-inner{ animation:float 5s ease-in-out infinite; }
  @keyframes float{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-9px);} }

  .glow-ring{
    position:absolute;
    width:min(300px, 55vw); height:min(300px, 55vw);
    border-radius:50%;
    background:radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
    animation:glowPulse 3s ease-in-out infinite;
  }
  @keyframes glowPulse{ 0%,100%{transform:scale(1); opacity:.7;} 50%{transform:scale(1.14); opacity:1;} }

  .ground-shadow{
    position:absolute;
    bottom:-10px; left:50%; transform:translateX(-50%);
    width:min(170px, 30vw); height:20px;
    background:radial-gradient(ellipse, var(--primary-glow) 0%, transparent 75%);
    border-radius:50%;
    animation:shadowPulse 5s ease-in-out infinite;
  }
  @keyframes shadowPulse{ 0%,100%{transform:translateX(-50%) scaleX(1); opacity:.7;} 50%{transform:translateX(-50%) scaleX(.72); opacity:.4;} }

  .bad-img{
    width:min(220px, 34vh, 42vw);
    height:auto;
    display:block;
    position:relative; z-index:2;
    user-select:none; -webkit-user-drag:none;
    filter:drop-shadow(0 16px 32px var(--primary-glow));
  }

  /* ============================================================
     TEXT
  ============================================================ */
  .error-code{
    font-family:var(--font-display); font-weight:800;
    font-size:clamp(52px, 11vw, 96px);
    line-height:.95; letter-spacing:-.03em;
    color:var(--text);
    opacity:0; animation:fadeUp .6s var(--ease) .5s forwards;
  }
  .error-code em{
    font-style:normal;
    background:linear-gradient(180deg, var(--primary-light), var(--primary));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }

  .headline{
    margin-top:10px;
    font-family:var(--font-display); font-weight:600;
    font-size:clamp(18px, 2.6vw, 23px);
    letter-spacing:-.2px; color:var(--text);
    opacity:0; animation:fadeUp .6s var(--ease) .62s forwards;
  }

  .subtext{
    margin-top:12px;
    font-size:14px; line-height:1.7; color:var(--text-muted);
    max-width:420px;
    opacity:0; animation:fadeUp .6s var(--ease) .74s forwards;
  }

  /* ============================================================
     ACTIONS
  ============================================================ */
  .actions{
    margin-top:24px;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:center;
    opacity:0; animation:fadeUp .6s var(--ease) .98s forwards;
  }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    font-size:13.5px; font-weight:600; letter-spacing:.1px;
    padding:11px 22px; border-radius:var(--radius-sm);
    text-decoration:none; border:none; cursor:pointer;
    transition:transform .2s var(--ease), box-shadow .2s var(--ease), background-color .2s var(--ease), border-color .2s var(--ease);
    position:relative; overflow:hidden;
  }
  .btn-icon{ width:15px; height:15px; flex-shrink:0; }

  .btn-primary{
    background:var(--primary); color:#fff;
    box-shadow:0 4px 16px var(--primary-glow);
  }
  .btn-primary:hover{ background:var(--primary-dark); transform:translateY(-2px); box-shadow:0 10px 26px rgba(230,57,63,.4); }
  .btn-primary:active{ transform:translateY(0); }

  .btn-ghost{
    background:transparent; color:var(--text-muted);
    border:1px solid var(--border-strong);
  }
  .btn-ghost:hover{ background:var(--surface-2); border-color:rgba(255,255,255,.22); color:var(--text); transform:translateY(-2px); }

  /* ============================================================
     PATH DISPLAY
  ============================================================ */
  .path-display{
    margin-top:24px;
    display:flex; align-items:center; gap:8px;
    opacity:0; animation:fadeUp .5s var(--ease) 1.1s forwards;
  }
  .path-label{ font-size:11px; color:var(--text-faint); letter-spacing:.2px; }
  .path-display code{
    font-family:var(--font-mono); font-size:11px;
    background:var(--surface-2); border:1px solid var(--border);
    border-radius:6px; padding:3px 9px; color:var(--text-muted);
    max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }

  /* ============================================================
     FOOTER
  ============================================================ */
  footer{
    display:flex; align-items:center; justify-content:center;
    padding-top:14px;
    opacity:0; animation:fadeUp .5s var(--ease) 1.05s forwards;
  }
  .footer-text{ font-size:11.5px; color:var(--text-faint); letter-spacing:.2px; }

  @keyframes fadeUp{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
  @keyframes fadeDown{ from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:translateY(0);} }

  /* ============================================================
     RESPONSIVE
  ============================================================ */
  @media (max-width:560px){
    .wrapper{ padding:16px 18px 14px; }
    .logo-svg{ max-height:40px; }
    .status-chip span:not(.status-dot){ display:none; }
    .status-chip{ padding:7px; }
    footer{ flex-wrap:wrap; gap:10px; }
  }
  @media (max-width:400px){
    .actions{ flex-direction:column; width:100%; }
    .btn{ width:100%; max-width:280px; }
  }

  @media (max-height:640px) and (orientation:landscape){
    body{ overflow-y:auto; }
    .illustration{ width:220px; margin-bottom:18px; }
    main{ padding:56px 0 20px; }
  }

  @media (prefers-reduced-motion:reduce){
    *, *::before, *::after{
      animation-duration:.001s !important;
      animation-iteration-count:1 !important;
      transition-duration:.001s !important;
      scroll-behavior:auto !important;
    }
  }
</style>
</head>
<body>

<a href="#main" class="skip-link">Pular para o conteúdo</a>

<div class="field" aria-hidden="true"></div>
<div class="grid-lines" aria-hidden="true"></div>
<div class="accent-line" aria-hidden="true"></div>

<div class="wrapper">

  <header>
    <a href="/" class="brand" aria-label="AdminEscala — página inicial">
      <img src="logu.svg" alt="AdminEscala" class="logo-svg" onerror="this.onerror=null; this.src='/logu.svg';">
    </a>
    <div class="status-chip">
      <span class="status-dot" aria-hidden="true"></span>
      <span>Erro 404</span>
    </div>
  </header>

  <main id="main">

    <div class="illustration" aria-hidden="true">
      <div class="glow-ring"></div>
      <div class="illustration-inner">
        <img
          src="bad.png"
          alt=""
          class="bad-img"
          draggable="false"
          id="badImg"
          onerror="this.replaceWith(document.getElementById('svg-fallback'))"
        />
        <svg id="svg-fallback" style="display:none" width="220" height="220" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" class="bad-img">
          <path d="M100 30 C65 30 42 55 42 90 L42 155 L55 142 L68 155 L81 142 L94 155 L107 142 L120 155 L133 142 L146 155 L158 90 C158 55 135 30 100 30Z" fill="#151822" stroke="rgba(230,57,63,.4)" stroke-width="2"/>
          <circle cx="80" cy="90" r="10" fill="white" opacity="0.9"/>
          <circle cx="120" cy="90" r="10" fill="white" opacity="0.9"/>
          <circle cx="83" cy="93" r="5" fill="#e6393f"/>
          <circle cx="123" cy="93" r="5" fill="#e6393f"/>
          <line x1="75" y1="85" x2="85" y2="95" stroke="#e6393f" stroke-width="2" stroke-linecap="round"/>
          <line x1="85" y1="85" x2="75" y2="95" stroke="#e6393f" stroke-width="2" stroke-linecap="round"/>
          <line x1="115" y1="85" x2="125" y2="95" stroke="#e6393f" stroke-width="2" stroke-linecap="round"/>
          <line x1="125" y1="85" x2="115" y2="95" stroke="#e6393f" stroke-width="2" stroke-linecap="round"/>
          <path d="M85 115 Q100 125 115 115" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round" fill="none"/>
        </svg>
      </div>
      <div class="ground-shadow"></div>
    </div>

    <h1 class="error-code">Erro <em>404</em></h1>
    <p class="headline">Este registro não existe na escala</p>
    <p class="subtext">
      O link pode ter expirado, o turno pode ter sido removido, ou o endereço foi digitado incorretamente. Verifique a URL e tente novamente.
    </p>

    <div class="actions">
      <a href="/" class="btn btn-primary">
        <svg class="btn-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/>
        </svg>
        Voltar ao início
      </a>
      <button class="btn btn-ghost" type="button" id="btnBack">
        <svg class="btn-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd"/>
        </svg>
        Voltar
      </button>
    </div>

    <div class="path-display">
      <span class="path-label">Endereço acessado:</span>
      <code id="pathCode">/</code>
    </div>

  </main>

  <footer>
    <span class="footer-text">© <span id="year"></span> AdminEscala. Todos os direitos reservados.</span>
  </footer>

</div>

<script>
(function(){
  'use strict';

  // Caminho atual
  var pathCode = document.getElementById('pathCode');
  if (pathCode) {
    var p = window.location.pathname || '/';
    pathCode.textContent = p.length > 42 ? p.slice(0, 39) + '…' : p;
  }

  // Ano corrente
  var year = document.getElementById('year');
  if (year) year.textContent = new Date().getFullYear();

  // Voltar
  var backBtn = document.getElementById('btnBack');
  if (backBtn) {
    backBtn.addEventListener('click', function(){
      if (history.length > 1) history.back();
      else window.location.href = '/';
    });
  }
})();
</script>
</body>
</html>
