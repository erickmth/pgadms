<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Importar Alunos - Sistema de Escalas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .card {
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            border: none;
            overflow: hidden;
        }
        .card-header {
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            color: white;
            padding: 25px;
            border: none;
        }
        .btn-import {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            border: none;
            padding: 12px 30px;
            font-weight: 600;
            transition: transform 0.3s;
        }
        .btn-import:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #20c997 0%, #28a745 100%);
        }
        .btn-clear {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            border: none;
            padding: 12px 30px;
            font-weight: 600;
        }
        .result-box {
            max-height: 400px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 13px;
        }
        .file-drop-area {
            border: 2px dashed #dee2e6;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f8f9fa;
        }
        .file-drop-area:hover {
            border-color: #28a745;
            background: #f0f9f0;
        }
        .file-drop-area.drag-over {
            border-color: #28a745;
            background: #e8f5e9;
        }
        .preview-table {
            max-height: 300px;
            overflow-y: auto;
            font-size: 13px;
        }
        .preview-table table {
            font-size: 12px;
        }
        .badge-status {
            font-size: 12px;
            padding: 5px 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-header text-center">
                        <h2 class="mb-0">
                            <i class="bi bi-file-excel me-2"></i>
                            Importação em Lote de Alunos
                        </h2>
                        <p class="text-white-50 mt-2 mb-0">Importe alunos via arquivo CSV ou Excel</p>
                    </div>
                    
                    <div class="card-body p-4">
                        <!-- Alertas -->
                        <div id="alertArea"></div>
                        
                        <!-- Seleção de Turma -->
                        <div class="mb-4">
                            <label class="form-label fw-bold">
                                <i class="bi bi-building"></i> Turma:
                            </label>
                            <select id="turmaSelect" class="form-select form-select-lg">
                                <option value="">Carregando turmas...</option>
                            </select>
                        </div>
                        
                        <!-- Área de Upload -->
                        <div class="mb-4">
                            <label class="form-label fw-bold">
                                <i class="bi bi-upload"></i> Arquivo:
                            </label>
                            <div id="dropArea" class="file-drop-area">
                                <i class="bi bi-cloud-upload fs-1 text-secondary"></i>
                                <p class="mt-2 mb-0">Clique ou arraste o arquivo aqui</p>
                                <small class="text-muted">Suporta .csv, .xlsx, .xls</small>
                                <input type="file" id="fileInput" style="display: none;" accept=".csv,.xlsx,.xls">
                            </div>
                        </div>
                        
                        <!-- Preview do Arquivo -->
                        <div id="previewArea" style="display: none;" class="mb-4">
                            <div class="alert alert-info">
                                <i class="bi bi-eye"></i> <strong>Pré-visualização:</strong>
                            </div>
                            <div class="preview-table border rounded p-2 bg-light">
                                <div id="previewContent"></div>
                            </div>
                        </div>
                        
                        <!-- Botões de Ação -->
                        <div class="d-flex gap-3">
                            <button id="importBtn" class="btn btn-import flex-grow-1" disabled>
                                <i class="bi bi-cloud-upload"></i> Importar Alunos
                            </button>
                            <button id="clearHistoryBtn" class="btn btn-clear">
                                <i class="bi bi-trash"></i> Limpar Histórico
                            </button>
                        </div>
                        
                        <!-- Link para baixar modelo -->
                        <div class="mt-3 text-center">
                            <a href="#" id="downloadTemplateBtn" class="text-decoration-none">
                                <i class="bi bi-download"></i> Baixar modelo de planilha (CSV)
                            </a>
                        </div>
                        
                        <!-- Resultado da Importação -->
                        <div id="resultArea" style="display: none;" class="mt-4">
                            <div class="card">
                                <div class="card-header bg-success text-white">
                                    <i class="bi bi-check-circle"></i> Resultado da Importação
                                </div>
                                <div class="card-body result-box" id="resultContent">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = 'https://erickmth.pythonanywhere.com';
        
        // Elementos
        const turmaSelect = document.getElementById('turmaSelect');
        const fileInput = document.getElementById('fileInput');
        const dropArea = document.getElementById('dropArea');
        const importBtn = document.getElementById('importBtn');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');
        const downloadTemplateBtn = document.getElementById('downloadTemplateBtn');
        const previewArea = document.getElementById('previewArea');
        const previewContent = document.getElementById('previewContent');
        const alertArea = document.getElementById('alertArea');
        const resultArea = document.getElementById('resultArea');
        const resultContent = document.getElementById('resultContent');
        
        let selectedFile = null;
        
        // Mostrar alerta
        function showAlert(message, type = 'info') {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type} alert-dismissible fade show`;
            alertDiv.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            alertArea.appendChild(alertDiv);
            setTimeout(() => alertDiv.remove(), 5000);
        }
        
        // Carregar turmas
        async function loadTurmas() {
            try {
                const response = await fetch(`${API_URL}/api/admin/status`, {
                    headers: {
                        'Authorization': 'Basic ' + btoa('admin:formare2026')
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    turmaSelect.innerHTML = '<option value="">Selecione uma turma</option>';
                    data.turmas.forEach(turma => {
                        const option = document.createElement('option');
                        option.value = turma;
                        option.textContent = turma;
                        turmaSelect.appendChild(option);
                    });
                } else {
                    turmaSelect.innerHTML = '<option value="">Erro ao carregar turmas</option>';
                }
            } catch (error) {
                console.error('Erro:', error);
                turmaSelect.innerHTML = '<option value="">Erro de conexão</option>';
            }
        }
        
        // Preview do CSV
        function previewCSV(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                const lines = content.split('\n').slice(0, 11); // Mostrar até 10 linhas
                
                let html = '<table class="table table-sm table-bordered"><thead><tr>';
                const headers = lines[0]?.split(',') || [];
                headers.forEach(h => html += `<th>${h.trim()}</th>`);
                html += '</tr></thead><tbody>';
                
                for (let i = 1; i < lines.length && i <= 10; i++) {
                    if (lines[i].trim()) {
                        const cells = lines[i].split(',');
                        html += '<tr>';
                        cells.forEach(c => html += `<td>${c.trim()}</td>`);
                        html += '</tr>';
                    }
                }
                html += '</tbody></table>';
                
                if (lines.length > 11) {
                    html += `<p class="text-muted small mt-2">... e mais ${lines.length - 11} linhas</p>`;
                }
                
                previewContent.innerHTML = html;
                previewArea.style.display = 'block';
            };
            reader.readAsText(file);
        }
        
        // Configurar upload
        function setupFileUpload() {
            dropArea.addEventListener('click', () => fileInput.click());
            
            dropArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropArea.classList.add('drag-over');
            });
            
            dropArea.addEventListener('dragleave', () => {
                dropArea.classList.remove('drag-over');
            });
            
            dropArea.addEventListener('drop', (e) => {
                e.preventDefault();
                dropArea.classList.remove('drag-over');
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    selectedFile = files[0];
                    handleFileSelect(selectedFile);
                }
            });
            
            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    selectedFile = e.target.files[0];
                    handleFileSelect(selectedFile);
                }
            });
        }
        
        function handleFileSelect(file) {
            const validExtensions = ['.csv', '.xlsx', '.xls'];
            const ext = file.name.substring(file.name.lastIndexOf('.')).toLowerCase();
            
            if (!validExtensions.includes(ext)) {
                showAlert('Formato de arquivo não suportado. Use .csv, .xlsx ou .xls', 'danger');
                selectedFile = null;
                importBtn.disabled = true;
                previewArea.style.display = 'none';
                return;
            }
            
            importBtn.disabled = false;
            
            if (ext === '.csv') {
                previewCSV(file);
            } else {
                previewContent.innerHTML = '<p class="text-muted">Pré-visualização disponível apenas para arquivos CSV</p>';
                previewArea.style.display = 'block';
            }
            
            showAlert(`Arquivo selecionado: ${file.name} (${(file.size / 1024).toFixed(2)} KB)`, 'success');
        }
        
        // Importar alunos
        async function importAlunos() {
            const turma = turmaSelect.value;
            
            if (!turma) {
                showAlert('Selecione uma turma', 'warning');
                return;
            }
            
            if (!selectedFile) {
                showAlert('Selecione um arquivo', 'warning');
                return;
            }
            
            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('turma', turma);
            
            importBtn.disabled = true;
            importBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Importando...';
            
            try {
                const response = await fetch(`${API_URL}/api/admin/alunos/import`, {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Basic ' + btoa('admin:formare2026')
                    },
                    body: formData
                });
                
                const result = await response.json();
                
                resultArea.style.display = 'block';
                
                if (response.ok && result.success) {
                    resultContent.innerHTML = `
                        <div class="text-success mb-3">
                            <i class="bi bi-check-circle-fill fs-3"></i>
                            <h4 class="mt-2">Importação concluída!</h4>
                        </div>
                        <p><strong>✅ Alunos importados:</strong> ${result.importados}</p>
                        ${result.erros && result.erros.length > 0 ? `
                            <hr>
                            <p><strong>⚠️ Erros encontrados (${result.erros.length}):</strong></p>
                            <ul class="text-danger">
                                ${result.erros.slice(0, 20).map(erro => `<li>${erro}</li>`).join('')}
                                ${result.erros.length > 20 ? `<li>... e mais ${result.erros.length - 20} erros</li>` : ''}
                            </ul>
                        ` : ''}
                    `;
                    showAlert(`${result.importados} alunos importados com sucesso!`, 'success');
                } else {
                    resultContent.innerHTML = `
                        <div class="text-danger mb-3">
                            <i class="bi bi-exclamation-triangle-fill fs-3"></i>
                            <h4 class="mt-2">Erro na importação</h4>
                        </div>
                        <p>${result.error || 'Erro ao processar o arquivo'}</p>
                    `;
                    showAlert(result.error || 'Erro na importação', 'danger');
                }
                
            } catch (error) {
                console.error('Erro:', error);
                resultArea.style.display = 'block';
                resultContent.innerHTML = `
                    <div class="text-danger mb-3">
                        <i class="bi bi-wifi-off fs-3"></i>
                        <h4 class="mt-2">Erro de conexão</h4>
                    </div>
                    <p>Não foi possível conectar ao servidor. Verifique sua conexão.</p>
                `;
                showAlert('Erro de conexão com o servidor', 'danger');
            } finally {
                importBtn.disabled = false;
                importBtn.innerHTML = '<i class="bi bi-cloud-upload"></i> Importar Alunos';
            }
        }
        
        // Limpar histórico
        async function clearHistory() {
            if (!confirm('⚠️ TEM CERTEZA? Isso irá apagar TODO o histórico de ações. Esta ação não pode ser desfeita!')) {
                return;
            }
            
            clearHistoryBtn.disabled = true;
            clearHistoryBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Limpando...';
            
            try {
                const response = await fetch(`${API_URL}/api/admin/historico`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': 'Basic ' + btoa('admin:formare2026')
                    }
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    showAlert(`✅ Histórico limpo! ${result.removidos} registros removidos.`, 'success');
                } else {
                    throw new Error(result.error || 'Erro ao limpar histórico');
                }
                
            } catch (error) {
                console.error('Erro:', error);
                showAlert(`❌ Erro: ${error.message}`, 'danger');
            } finally {
                clearHistoryBtn.disabled = false;
                clearHistoryBtn.innerHTML = '<i class="bi bi-trash"></i> Limpar Histórico';
            }
        }
        
        // Download do modelo
        function downloadTemplate() {
            const headers = ['EDV', 'NOME'];
            const samples = [
                ['12345', 'João Silva'],
                ['67890', 'Maria Oliveira'],
                ['11121', 'Pedro Santos'],
                ['22233', 'Ana Clara'],
                ['33344', 'Lucas Ferreira']
            ];
            
            const csvContent = [headers, ...samples].map(row => row.join(',')).join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.href = url;
            link.setAttribute('download', 'modelo_importacao_alunos.csv');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            
            showAlert('Modelo baixado! Preencha com seus dados e importe.', 'info');
        }
        
        // Event Listeners
        importBtn.addEventListener('click', importAlunos);
        clearHistoryBtn.addEventListener('click', clearHistory);
        downloadTemplateBtn.addEventListener('click', (e) => {
            e.preventDefault();
            downloadTemplate();
        });
        
        turmaSelect.addEventListener('change', () => {
            if (turmaSelect.value && selectedFile) {
                importBtn.disabled = false;
            } else {
                importBtn.disabled = !selectedFile;
            }
        });
        
        // Inicializar
        loadTurmas();
        setupFileUpload();
        
        // Verificar autenticação
        async function checkAuth() {
            try {
                const response = await fetch(`${API_URL}/api/admin/status`, {
                    headers: {
                        'Authorization': 'Basic ' + btoa('admin:formare2026')
                    }
                });
                if (!response.ok) {
                    window.location.href = 'index.html';
                }
            } catch (error) {
                window.location.href = 'index.html';
            }
        }
        checkAuth();
    </script>
</body>
</html>
