<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Lista de Presença - Sistema de Escalas</title>
    <link rel="shortcut icon" type="image/x-icon" href="favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ec3333;
            --primary-dark: #c82333;
            --primary-glow: rgba(236, 51, 51, 0.18);
            --sidebar-bg: #181e2a;
            --surface: #ffffff;
            --surface-2: #f4f6fb;
            --surface-3: #edf0f7;
            --text: #1a1d2e;
            --text-muted: #6b7280;
            --border: #e5e9f2;
            --success: #10b981;
            --warning: #f59e0b;
            --info: #3b82f6;
            --card-shadow: 0 2px 20px rgba(24, 30, 42, 0.08);
            --radius: 14px;
            --radius-sm: 8px;
            --transition: all 0.2s ease;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Sora', sans-serif;
            background: var(--surface-2);
            color: var(--text);
            margin: 0;
            min-height: 100vh;
        }

        /* Header */
        .user-header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            background: rgba(255,255,255,0.95);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-avatar {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 18px;
        }

        .user-details h4 {
            font-size: 15px;
            font-weight: 700;
            margin: 0;
        }

        .user-details p {
            font-size: 12px;
            color: var(--text-muted);
            margin: 2px 0 0;
        }

        .class-badge {
            background: var(--surface-2);
            padding: 8px 16px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 500;
        }

        .class-badge i { color: var(--primary); }

        .back-button {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
        }

        .back-button:hover {
            background: var(--surface-3);
            transform: translateX(-2px);
        }

        /* Main Content */
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }

        /* Cards */
        .card {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--card-shadow);
            background: var(--surface);
            margin-bottom: 24px;
            overflow: hidden;
        }

        .card-header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .card-header h5 {
            font-size: 14px;
            font-weight: 700;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-header h5 i { color: var(--primary); }

        .card-body { padding: 24px; }

        /* Formulário */
        .form-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
        }

        .form-control, .form-select {
            font-family: 'Sora', sans-serif;
            font-size: 14px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 9px 14px;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
            outline: none;
        }

        /* Tabela de alunos */
        .students-table { overflow-x: auto; }

        .table {
            font-size: 13.5px;
            margin-bottom: 0;
        }

        .table thead th {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-muted);
            border-bottom: 2px solid var(--border);
            padding: 12px 16px;
            background: var(--surface-2);
        }

        .table tbody td {
            padding: 12px 16px;
            vertical-align: middle;
            border-bottom: 1px solid var(--border);
        }

        .table tbody tr:hover { background: var(--surface-2); }

        /* Botões de status */
        .status-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-status {
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 40px;
            transition: var(--transition);
            cursor: pointer;
            border: 1.5px solid transparent;
        }

        .btn-presente {
            background: rgba(16, 185, 129, 0.1);
            color: #059669;
            border-color: rgba(16, 185, 129, 0.3);
        }

        .btn-presente.active, .btn-presente:hover {
            background: #10b981;
            color: white;
            border-color: #10b981;
            transform: scale(1.02);
        }

        .btn-ausente {
            background: rgba(236, 51, 51, 0.1);
            color: var(--primary-dark);
            border-color: rgba(236, 51, 51, 0.3);
        }

        .btn-ausente.active, .btn-ausente:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            transform: scale(1.02);
        }

        .btn-atestado {
            background: rgba(59, 130, 246, 0.1);
            color: #1d4ed8;
            border-color: rgba(59, 130, 246, 0.3);
        }

        .btn-atestado.active, .btn-atestado:hover {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
            transform: scale(1.02);
        }

        /* Botões gerais */
        .btn {
            font-family: 'Sora', sans-serif;
            font-weight: 600;
            font-size: 13px;
            border-radius: var(--radius-sm);
            transition: var(--transition);
        }

        .btn-primary {
            background: var(--primary);
            border-color: var(--primary);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .btn-success {
            background: var(--success);
            border-color: var(--success);
        }

        .btn-success:hover {
            transform: translateY(-1px);
        }

        .btn-outline-secondary {
            border-color: var(--border);
            color: var(--text-muted);
        }

        .btn-outline-secondary:hover {
            background: var(--surface-3);
            color: var(--text);
        }

        /* Alertas */
        .alert {
            border-radius: var(--radius-sm);
            border: none;
            font-size: 13.5px;
        }

        .alert-warning {
            background: rgba(245, 158, 11, 0.1);
            color: #b45309;
            border-left: 3px solid var(--warning);
        }

        /* Info do responsável */
        .responsavel-info {
            background: var(--surface-2);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 16px;
        }

        .responsavel-info span { font-size: 12px; color: var(--text-muted); }
        .responsavel-info strong { color: var(--primary); }

        /* Footer */
        .footer-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        /* Loading */
        .loading {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.35);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Responsividade */
        @media (max-width: 768px) {
            .user-header { flex-direction: column; align-items: flex-start; }
            .user-info { width: 100%; justify-content: space-between; }
            .main-container { padding: 16px; }
            .card-header { flex-direction: column; align-items: flex-start; }
            .table thead th, .table tbody td { padding: 8px 12px; }
            .status-buttons { gap: 4px; }
            .btn-status { padding: 4px 10px; font-size: 11px; }
        }

        @media (max-width: 576px) {
            .table { font-size: 12px; }
            .btn-status { padding: 3px 8px; }
        }
    </style>
</head>
<body>

    <div class="user-header">
        <div class="user-info">
            <div class="user-avatar" id="userAvatar">?</div>
            <div class="user-details">
                <h4 id="userName">Carregando...</h4>
                <p id="userRole">Painel Administrativo</p>
            </div>
        </div>
        <div class="class-badge" id="classInfo">
            <i class="bi bi-building"></i>
            <span id="className">Formare 2026</span>
        </div>
        <a href="index.html" class="back-button">
            <i class="bi bi-arrow-left"></i> Voltar ao Painel
        </a>
    </div>

    <div class="main-container">
        <!-- Seleção de Turma e Data -->
        <div class="card">
            <div class="card-header">
                <h5><i class="bi bi-calendar-event"></i> Selecionar Turma e Data</h5>
                <button class="btn btn-outline-secondary btn-sm" id="refreshBtn">
                    <i class="bi bi-arrow-repeat"></i> Atualizar
                </button>
            </div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-5">
                        <label for="turmaSelect" class="form-label">Turma</label>
                        <select class="form-select" id="turmaSelect">
                            <option value="">Carregando turmas...</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label for="dataSelect" class="form-label">Data</label>
                        <input type="date" class="form-control" id="dataSelect">
                    </div>
                </div>
                <div class="alert alert-warning mt-3 d-none" id="weekendAlert">
                    <i class="bi bi-calendar-x"></i> <strong>Fim de semana!</strong> A chamada só pode ser registrada em dias úteis (segunda a sexta).
                </div>
            </div>
        </div>

        <!-- Lista de Presença -->
        <div class="card" id="presencaCard">
            <div class="card-header">
                <h5><i class="bi bi-person-lines-fill"></i> Lista de Presença</h5>
                <span class="badge bg-primary" id="alunosCount">0 alunos</span>
            </div>
            <div class="card-body">
                <div class="students-table">
                    <table class="table">
                        <thead>
                            32
                                <th>Aluno</th>
                                <th style="width: 280px">Status</th>
                            </tr>
                        </thead>
                        <tbody id="alunosList">
                            <tr>
                                <td colspan="2" class="text-center text-muted py-4">
                                    <span class="loading"></span> Carregando alunos...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Informações do responsável -->
                <div id="responsavelInfo" class="responsavel-info d-none">
                    <div>
                        <i class="bi bi-person-check"></i> <span>Registrado por:</span>
                        <strong id="responsavelNome">-</strong>
                    </div>
                    <div>
                        <i class="bi bi-clock-history"></i> <span>Em:</span>
                        <strong id="responsavelData">-</strong>
                    </div>
                </div>

                <div class="footer-actions">
                    <button class="btn btn-outline-secondary" id="resetPresencaBtn">
                        <i class="bi bi-arrow-counterclockwise"></i> Resetar Todos
                    </button>
                    <button class="btn btn-success" id="salvarPresencaBtn">
                        <i class="bi bi-check-lg"></i> Salvar Chamada
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Mensagem -->
    <div class="modal fade" id="messageModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header" id="messageModalHeader">
                    <h5 class="modal-title" id="messageModalTitle">Mensagem</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="messageModalBody"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">OK</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ============================================
        // CONFIGURAÇÕES
        // ============================================
        const API_URL = 'https://erickmth.pythonanywhere.com';
        let currentTurma = '';
        let currentData = '';
        let alunosList = [];
        let registros = [];
        let currentResponsavel = null;

        // Elementos DOM
        const elements = {
            turmaSelect: document.getElementById('turmaSelect'),
            dataSelect: document.getElementById('dataSelect'),
            refreshBtn: document.getElementById('refreshBtn'),
            presencaCard: document.getElementById('presencaCard'),
            alunosList: document.getElementById('alunosList'),
            alunosCount: document.getElementById('alunosCount'),
            salvarPresencaBtn: document.getElementById('salvarPresencaBtn'),
            resetPresencaBtn: document.getElementById('resetPresencaBtn'),
            weekendAlert: document.getElementById('weekendAlert'),
            responsavelInfo: document.getElementById('responsavelInfo'),
            responsavelNome: document.getElementById('responsavelNome'),
            responsavelData: document.getElementById('responsavelData'),
            userName: document.getElementById('userName'),
            userAvatar: document.getElementById('userAvatar'),
            className: document.getElementById('className')
        };

        const messageModal = new bootstrap.Modal('#messageModal');

        // ============================================
        // AUTENTICAÇÃO
        // ============================================
        
        function getAuthHeader() {
            const token = sessionStorage.getItem('adminToken');
            if (token) return { 'Authorization': 'Bearer ' + token };
            return {};
        }

        async function checkAuth() {
            const token = sessionStorage.getItem('adminToken');
            if (!token) {
                showMessage('Sessão Expirada', 'Por favor, faça login novamente.', 'warning');
                setTimeout(() => window.location.href = 'index.html', 2000);
                return false;
            }
            
            try {
                const response = await fetch(`${API_URL}/api/admin/backup`, { headers: getAuthHeader() });
                if (response.ok) {
                    const adminName = sessionStorage.getItem('adminName');
                    updateUserUI(adminName || 'Admin', true);
                    return true;
                }
                throw new Error('Token inválido');
            } catch (error) {
                showMessage('Sessão Expirada', 'Sua sessão expirou. Faça login novamente.', 'warning');
                setTimeout(() => window.location.href = 'index.html', 2000);
                return false;
            }
        }
        
        function updateUserUI(nome, isAdmin) {
            elements.userName.textContent = nome;
            elements.userAvatar.textContent = nome.charAt(0).toUpperCase();
        }
        
        // ============================================
        // FUNÇÕES PRINCIPAIS
        // ============================================
        
        async function loadTurmas() {
            try {
                const response = await fetch(`${API_URL}/api/admin/backup`, { headers: getAuthHeader() });
                if (!response.ok) throw new Error('Erro ao carregar turmas');
                
                const data = await response.json();
                const turmas = Object.keys(data.alunos) || [];
                
                elements.turmaSelect.innerHTML = '<option value="">Selecione uma turma</option>';
                turmas.forEach(turma => {
                    const option = document.createElement('option');
                    option.value = turma;
                    option.textContent = turma;
                    elements.turmaSelect.appendChild(option);
                });
                
                if (turmas.includes('Formare 2026')) {
                    elements.turmaSelect.value = 'Formare 2026';
                    elements.className.textContent = 'Formare 2026';
                    currentTurma = 'Formare 2026';
                }
                
                setDefaultDate();
                await carregarTudo();
                
            } catch (error) {
                console.error('Erro ao carregar turmas:', error);
                elements.turmaSelect.innerHTML = '<option value="">Erro ao carregar turmas</option>';
                showMessage('Erro', 'Não foi possível carregar as turmas.', 'error');
            }
        }
        
        function setDefaultDate() {
            const today = new Date();
            const dayOfWeek = today.getDay();
            let defaultDate = new Date(today);
            
            if (dayOfWeek === 0) defaultDate.setDate(today.getDate() + 1);
            else if (dayOfWeek === 6) defaultDate.setDate(today.getDate() + 2);
            
            const year = defaultDate.getFullYear();
            const month = String(defaultDate.getMonth() + 1).padStart(2, '0');
            const day = String(defaultDate.getDate()).padStart(2, '0');
            elements.dataSelect.value = `${year}-${month}-${day}`;
            currentData = elements.dataSelect.value;
        }
        
        function checkWeekend(dateStr) {
            const date = new Date(dateStr);
            const isWeekend = date.getDay() === 0 || date.getDay() === 6;
            elements.weekendAlert.classList.toggle('d-none', !isWeekend);
            return isWeekend;
        }
        
        async function loadAlunos(turma) {
            try {
                const response = await fetch(`${API_URL}/api/admin/turmas/${encodeURIComponent(turma)}/alunos`, {
                    headers: getAuthHeader()
                });
                if (!response.ok) throw new Error('Erro ao carregar alunos');
                
                const alunos = await response.json();
                alunosList = [];
                
                for (const [edv, nome] of Object.entries(alunos)) {
                    alunosList.push({
                        edv: edv,
                        nome: nome.replace(/👩‍🏫|👨‍🏫/g, '')
                    });
                }
                
                alunosList.sort((a, b) => a.nome.localeCompare(b.nome));
                elements.alunosCount.textContent = `${alunosList.length} alunos`;
                return alunosList;
            } catch (error) {
                showMessage('Erro', 'Não foi possível carregar os alunos.', 'error');
                return [];
            }
        }
        
        async function loadPresenca(data, turma) {
            try {
                const response = await fetch(`${API_URL}/api/presenca/obter/${data}?turma=${encodeURIComponent(turma)}`, {
                    headers: getAuthHeader()
                });
                
                if (response.status === 404) return null;
                if (!response.ok) throw new Error('Erro ao carregar presença');
                
                const result = await response.json();
                if (result.created_by) {
                    currentResponsavel = {
                        nome: result.created_by,
                        criado_em: result.created_at
                    };
                    updateResponsavelInfo();
                }
                return result.registros || [];
            } catch (error) {
                return null;
            }
        }
        
        async function loadResponsavel(data, turma) {
            try {
                const response = await fetch(`${API_URL}/api/presenca/responsavel/${data}?turma=${encodeURIComponent(turma)}`, {
                    headers: getAuthHeader()
                });
                
                if (response.ok) {
                    const result = await response.json();
                    currentResponsavel = {
                        nome: result.responsavel,
                        criado_em: result.criado_em
                    };
                    updateResponsavelInfo();
                } else {
                    currentResponsavel = null;
                    elements.responsavelInfo.classList.add('d-none');
                }
            } catch (error) {
                currentResponsavel = null;
                elements.responsavelInfo.classList.add('d-none');
            }
        }
        
        function updateResponsavelInfo() {
            if (currentResponsavel?.nome) {
                elements.responsavelNome.textContent = currentResponsavel.nome;
                if (currentResponsavel.criado_em) {
                    elements.responsavelData.textContent = new Date(currentResponsavel.criado_em).toLocaleString('pt-BR');
                }
                elements.responsavelInfo.classList.remove('d-none');
            } else {
                elements.responsavelInfo.classList.add('d-none');
            }
        }
        
        function renderTable() {
            if (alunosList.length === 0) {
                elements.alunosList.innerHTML = `
                    <tr><td colspan="2" class="text-center text-muted py-4">
                        <i class="bi bi-people"></i> Nenhum aluno cadastrado nesta turma
                    </td></tr>
                `;
                return;
            }
            
            elements.alunosList.innerHTML = '';
            
            alunosList.forEach(aluno => {
                const registro = registros.find(r => r.name === aluno.nome);
                const status = registro ? registro.status : 'PRESENTE';
                
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${aluno.nome}</strong><br><small class="text-muted">EDV: ${aluno.edv}</small></td>
                    <td>
                        <div class="status-buttons" data-aluno="${aluno.nome}">
                            <button class="btn-status btn-presente ${status === 'PRESENTE' ? 'active' : ''}" data-status="PRESENTE">
                                <i class="bi bi-check-circle-fill"></i> Presente
                            </button>
                            <button class="btn-status btn-ausente ${status === 'AUSENTE' ? 'active' : ''}" data-status="AUSENTE">
                                <i class="bi bi-x-circle-fill"></i> Ausente
                            </button>
                            <button class="btn-status btn-atestado ${status === 'ATESTADO' ? 'active' : ''}" data-status="ATESTADO">
                                <i class="bi bi-file-medical-fill"></i> Atestado
                            </button>
                        </div>
                    </td>
                `;
                
                elements.alunosList.appendChild(row);
            });
            
            // Adicionar event listeners para os botões
            document.querySelectorAll('.status-buttons').forEach(container => {
                const alunoNome = container.getAttribute('data-aluno');
                const buttons = container.querySelectorAll('.btn-status');
                
                buttons.forEach(btn => {
                    btn.addEventListener('click', () => {
                        const newStatus = btn.getAttribute('data-status');
                        
                        // Atualizar registro
                        const registroIndex = registros.findIndex(r => r.name === alunoNome);
                        if (registroIndex >= 0) {
                            registros[registroIndex].status = newStatus;
                        } else {
                            registros.push({ name: alunoNome, status: newStatus });
                        }
                        
                        // Atualizar visual dos botões
                        buttons.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                    });
                });
            });
        }
        
        function resetAllStatus() {
            registros = alunosList.map(aluno => ({
                name: aluno.nome,
                status: 'PRESENTE'
            }));
            renderTable();
            showMessage('Reset', 'Todos os status foram resetados para "Presente".', 'info');
        }
        
        async function saveAttendance() {
            if (!currentTurma || !currentData) {
                showMessage('Erro', 'Selecione turma e data.', 'error');
                return;
            }
            
            if (checkWeekend(currentData)) {
                showMessage('Erro', 'Não é possível salvar chamada em finais de semana.', 'error');
                return;
            }
            
            try {
                elements.salvarPresencaBtn.disabled = true;
                elements.salvarPresencaBtn.innerHTML = '<span class="loading"></span> Salvando...';
                
                const response = await fetch(`${API_URL}/api/presenca/salvar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', ...getAuthHeader() },
                    body: JSON.stringify({
                        data: currentData,
                        turma: currentTurma,
                        registros: registros
                    })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Erro ao salvar chamada');
                }
                
                const result = await response.json();
                showMessage('Sucesso', 'Chamada salva com sucesso!', 'success');
                
                if (result.created_by) {
                    currentResponsavel = { nome: result.created_by, criado_em: new Date().toISOString() };
                    updateResponsavelInfo();
                }
                
            } catch (error) {
                showMessage('Erro', error.message, 'error');
            } finally {
                elements.salvarPresencaBtn.disabled = false;
                elements.salvarPresencaBtn.innerHTML = '<i class="bi bi-check-lg"></i> Salvar Chamada';
            }
        }
        
        async function carregarTudo() {
            const turma = elements.turmaSelect.value || currentTurma;
            const data = elements.dataSelect.value || currentData;
            
            if (!turma || !data) return;
            
            const isWeekend = checkWeekend(data);
            if (isWeekend) return;
            
            currentTurma = turma;
            currentData = data;
            elements.className.textContent = turma;
            
            elements.alunosList.innerHTML = '<tr><td colspan="2" class="text-center py-4"><span class="loading"></span> Carregando alunos...</td></tr>';
            
            try {
                await loadAlunos(turma);
                const presencaExistente = await loadPresenca(data, turma);
                
                if (presencaExistente && presencaExistente.length > 0) {
                    registros = [...presencaExistente];
                } else {
                    registros = alunosList.map(aluno => ({ name: aluno.nome, status: 'PRESENTE' }));
                }
                
                await loadResponsavel(data, turma);
                renderTable();
                
            } catch (error) {
                elements.alunosList.innerHTML = `
                    <tr><td colspan="2" class="text-center text-danger py-4">
                        <i class="bi bi-exclamation-triangle"></i> Erro ao carregar dados
                    </td></tr>
                `;
            }
        }
        
        function showMessage(title, message, type = 'info') {
            const modalTitle = document.getElementById('messageModalTitle');
            const modalBody = document.getElementById('messageModalBody');
            const modalHeader = document.getElementById('messageModalHeader');
            
            modalTitle.textContent = title;
            modalBody.textContent = message;
            
            modalHeader.className = 'modal-header';
            if (type === 'success') modalHeader.classList.add('bg-success', 'text-white');
            else if (type === 'error') modalHeader.classList.add('bg-danger', 'text-white');
            else if (type === 'warning') modalHeader.classList.add('bg-warning', 'text-dark');
            else modalHeader.classList.add('bg-primary', 'text-white');
            
            messageModal.show();
        }
        
        // ============================================
        // EVENT LISTENERS
        // ============================================
        
        elements.turmaSelect.addEventListener('change', () => {
            currentTurma = elements.turmaSelect.value;
            if (currentTurma && currentData) carregarTudo();
        });
        
        elements.dataSelect.addEventListener('change', () => {
            currentData = elements.dataSelect.value;
            checkWeekend(currentData);
            if (currentTurma && currentData && !checkWeekend(currentData)) carregarTudo();
        });
        
        elements.refreshBtn.addEventListener('click', () => {
            if (currentTurma && currentData && !checkWeekend(currentData)) {
                carregarTudo();
            } else {
                loadTurmas();
            }
        });
        
        elements.salvarPresencaBtn.addEventListener('click', saveAttendance);
        elements.resetPresencaBtn.addEventListener('click', resetAllStatus);
        
        // ============================================
        // INICIALIZAÇÃO
        // ============================================
        
        async function init() {
            const isAuth = await checkAuth();
            if (!isAuth) return;
            await loadTurmas();
        }
        
        init();
        
    </script>
</body>
</html>
